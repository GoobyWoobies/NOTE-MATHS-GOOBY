<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="380" height="300" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="380" height="300" rx="12" fill="#ffffff"/>
<circle cx="150" cy="170" r="110" fill="none" stroke="#adb5bd" stroke-width="1.5"/>
<!-- rayons -->
<line x1="150" y1="170" x2="260" y2="170" stroke="#1971c2" stroke-width="3"/>
<line x1="150" y1="170" x2="209.43" y2="77.44" stroke="#1971c2" stroke-width="3"/>
<!-- arc de longueur r -->
<path d="M 260 170 A 110 110 0 0 0 209.43 77.44" fill="none" stroke="#e03131" stroke-width="5"/>
<!-- marque de l'angle -->
<path d="M 180 170 A 30 30 0 0 0 166.21 144.76" fill="none" stroke="#212529" stroke-width="1.5"/>
<circle cx="150" cy="170" r="3.5" fill="#212529"/>
<text x="140" y="190" font-size="14" fill="#212529">O</text>
<text x="200" y="190" font-size="17" font-weight="bold" fill="#1971c2">r</text>
<text x="160" y="118" font-size="17" font-weight="bold" fill="#1971c2">r</text>
<text x="186" y="160" font-size="14" fill="#212529">1 rad</text>
<text x="262" y="112" font-size="16" font-weight="bold" fill="#e03131">arc = r</text>
<text x="190" y="272" font-size="13" fill="#495057" text-anchor="middle">1 radian = l'angle qui découpe un arc</text>
<text x="190" y="289" font-size="13" fill="#495057" text-anchor="middle">de même longueur que le rayon</text>
</svg>
