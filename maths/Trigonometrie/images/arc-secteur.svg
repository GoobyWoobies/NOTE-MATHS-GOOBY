<path d="M 125 240 A 45 45 0 0 0 108.93 205.53" fill="none" stroke="#212529" stroke-width="1.5"/>
<circle cx="80" cy="240" r="3.5" fill="#212529"/>
<text x="66" y="258" font-size="14" fill="#212529">O</text>
<text x="175" y="262" font-size="17" font-weight="bold" fill="#1971c2">r</text>
<text x="125" y="160" font-size="17" font-weight="bold" fill="#1971c2">r</text>
<text x="130" y="230" font-size="17" font-weight="bold" fill="#212529">α</text>
<text x="266" y="140" font-size="16" font-weight="bold" fill="#e03131">L = r · α</text>
<text x="165" y="200" font-size="15" font-weight="bold" fill="#1864ab">A = r²·α / 2</text>
<text x="210" y="288" font-size="13" fill="#495057" text-anchor="middle">α en radians : L = longueur d'arc, A = aire du secteur</text>
